
name: Run Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 8
      uses: actions/setup-java@v6
      with:
        java-version: '8'
        distribution: 'temurin'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Run test
      run: ./gradlew build
    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: jcommand-jar
        path: build/libs/*.jar
        if-no-files-found: error
